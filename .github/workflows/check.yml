name: check

on:
  push:
  pull_request:
  schedule:
    - cron: '0 3 * * 1' # every Monday: look for official updates
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check translation
        run: python scripts/check.py

  official-updates:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch official language files
        run: python scripts/fetch.py

      - name: Open an issue if the official files changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- official/; then
            echo "Official files are unchanged."
            exit 0
          fi
          git diff --stat -- official/
          python scripts/official_diff.py > report.md
          cat report.md >> "$GITHUB_STEP_SUMMARY"
          title="官方語言檔更新 ($(sha256sum official/default.c | cut -c1-8))"
          existing=$(gh issue list --state open --limit 100 --json title --jq "[.[] | select(.title == \"$title\")] | length")
          if [ "$existing" != "0" ]; then
            echo "An open issue already exists for this update."
          else
            gh issue create --title "$title" --body-file report.md
          fi
