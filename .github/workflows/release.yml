name: release

# Push a tag such as v1.0.0 to create a DRAFT release with dist/arcdps_lang.ini attached.
# Review the draft on GitHub, then publish it.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check translation
        run: python scripts/check.py

      - name: dist/arcdps_lang.ini is up to date
        run: |
          python scripts/build.py
          git diff --exit-code -- dist/ || (echo "::error::dist/arcdps_lang.ini is stale, run python scripts/build.py and commit it before tagging" && exit 1)

      - name: Write release notes
        run: python scripts/release_notes.py "$GITHUB_REF_NAME" > notes.md

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/arcdps_lang.ini \
            --draft \
            --title "ArcDPS 繁體中文語言檔 $GITHUB_REF_NAME" \
            --notes-file notes.md \
            --generate-notes
